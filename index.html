<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COOL stuff - Web Apps & Tools</title>
  <link rel="stylesheet" href="button.css">
  <style>
    :root {
      --bg-color: #fbf9f1;
      --dot-color: #d8d5ca;
      --text-color: #000000;
      --yellow-accent: #ffde00;
      --blue-accent: #0084ff;
      --shadow-color: #000000;
    }

    [data-theme="dark"] {
      --bg-color: #121316;
      --dot-color: #2b2d35;
      --text-color: #ffffff;
      --yellow-accent: #ffde00;
      --blue-accent: #0084ff;
      --shadow-color: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(var(--dot-color) 2px, transparent 2px);
      background-size: 24px 24px;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .top-bar {
      width: 100%;
      max-width: 950px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      margin-bottom: 2.5rem;
    }

    .theme-toggle-btn {
      background: var(--blue-accent);
      border: 3.5px solid #000000;
      border-radius: 14px;
      box-shadow: 4px 4px 0px var(--shadow-color);
      width: 62px;
      height: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .theme-toggle-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--shadow-color);
    }

    .theme-toggle-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--shadow-color);
    }

    .theme-toggle-btn svg {
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .theme-toggle-btn .sun-icon {
      display: none;
    }

    .theme-toggle-btn .moon-icon {
      display: block;
    }

    [data-theme="dark"] .theme-toggle-btn .sun-icon {
      display: block;
    }

    [data-theme="dark"] .theme-toggle-btn .moon-icon {
      display: none;
    }

    .hero-container {
      max-width: 900px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    .hero-container img {
      width: min(40vw, 500px);
    }

    .main-headline {
      font-size: 3.6rem;
      font-weight: 900;
      line-height: 1.15;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      margin-top: 1rem;
    }

    .highlight-block {
      display: inline-block;
      background: var(--yellow-accent);
      color: #000000;
      padding: 4px 20px;
      border: 3.5px solid #000000;
      box-shadow: 6px 6px 0px #000000;
      transform: rotate(-1.5deg);
      margin-top: 10px;
    }

    .sub-text {
      font-size: 1.35rem;
      font-weight: 700;
      max-width: 720px;
      margin: 2.5rem auto 2.5rem auto;
      line-height: 1.45;
    }

    @media (max-width: 600px) {
      .main-headline { font-size: 2.4rem; }
      .sub-text { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Light/Dark Mode" aria-label="Toggle Theme">
      <svg class="sun-icon" width="24" height="24" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="moon-icon" width="24" height="24" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </header>

  <main class="hero-container">
    <img src="logo.png" alt="Cool Stuff Logo">

    <h2 class="main-headline">
      FREE WEB APPS & TOOLS<br>
      <span class="highlight-block">FOR ANYONE.</span>
    </h2>

    <p class="sub-text">Many more useful, deeply unserious things are cooking.</p>

    <button class="swipe-btn">
      <span class="icon-box">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </span>
      <span class="text-wrapper">
        <span class="text-slide">
          <span>Explore Projects</span>
          <span>Explore Projects</span>
        </span>
      </span>
    </button>
  </main>

  <script>
    const themeToggleBtn = document.getElementById('themeToggle');

    const savedTheme = localStorage.getItem('theme') || 
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
    });
  </script>

</body>
</html>
